[project]
name = "chasezero-backend"
version = "0.1.0"
description = "ChaseZero Multi-Agent KYC Chasing Workflow Backend for Northgate Bank"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.8",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
build = [
    "pyinstaller>=6.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
