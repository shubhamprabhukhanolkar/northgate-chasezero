name: Build, Test & Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  ARTIFACT_REPO: northgate-repo
  SERVICE_NAME: northgate-chasezero

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: uv sync --extra dev

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        run: uv run pytest -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build

  deploy:
    name: Build Docker Container & Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 2: Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 460.0.0"

      # Step 3: Configure Cloud SDK Project & Docker Authentication
      - name: Configure Cloud SDK & Docker
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          echo "Authenticated project: ${PROJECT_ID}"
          gcloud config set project "${PROJECT_ID}" --quiet
          echo "Ensuring Artifact Registry repository exists in ${{ env.GCP_REGION }}..."
          gcloud artifacts repositories create "${{ env.ARTIFACT_REPO }}" \
            --repository-format=docker \
            --location="${{ env.GCP_REGION }}" \
            --description="Docker repository for Project Northgate" \
            --project="${PROJECT_ID}" \
            --quiet || echo "Repository ${{ env.ARTIFACT_REPO }} already exists or is ready."
          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      # Step 4: Build & Push Unified ChaseZero Docker Image
      - name: Build & Push Docker Image
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:latest"
          echo "Building image: ${IMAGE_TAG}"
          docker build --platform linux/amd64 -t "${IMAGE_TAG}" -t "${LATEST_TAG}" .
          docker push "${IMAGE_TAG}"
          docker push "${LATEST_TAG}"

      # Step 5: Deploy Unified Service to Cloud Run
      - name: Deploy ChaseZero to Cloud Run
        id: deploy-service
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          ENV_VARS="ENVIRONMENT=production,LLM_PROVIDER=auto,GEMINI_MODEL=gemini-3.8-flash,CHASEZERO_DB_PATH=/tmp/chasezero.db"
          if [ -n "${GOOGLE_API_KEY:-}" ]; then
            ENV_VARS="${ENV_VARS},GOOGLE_API_KEY=${GOOGLE_API_KEY}"
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            ENV_VARS="${ENV_VARS},OPENAI_API_KEY=${OPENAI_API_KEY}"
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            ENV_VARS="${ENV_VARS},ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
          fi
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "${IMAGE_TAG}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --quiet \
            --set-env-vars "${ENV_VARS}"
          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.GCP_REGION }}" --project "${PROJECT_ID}" --format "value(status.url)")
          echo "SERVICE_URL=${SERVICE_URL}" >> "${GITHUB_ENV}"
          echo "service_url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"

      # Step 6: Post Deployment Summary to GitHub Actions Job
      - name: Deployment Summary
        run: |
          echo "### Project Northgate — ChaseZero Deployed to Google Cloud Run" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Service | Region | Cloud Run Endpoint |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| :--- | :--- | :--- |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| **ChaseZero UI** | ${{ env.GCP_REGION }} | [${{ env.SERVICE_URL }}](${{ env.SERVICE_URL }}) |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| **FastAPI Swagger Docs** | ${{ env.GCP_REGION }} | [${{ env.SERVICE_URL }}/docs](${{ env.SERVICE_URL }}/docs) |" >> "${GITHUB_STEP_SUMMARY}"
