name: CI/CD — Test, Build & Deploy ChaseZero to GCP Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  SERVICE_NAME: chasezero
  ARTIFACT_REPO: chasezero
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  ci-test:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 via uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install backend & test dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run LangGraph & FastAPI integration tests
        working-directory: backend
        run: uv run pytest -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React + Tailwind CSS v4 frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy-gcp:
    name: Build Docker Image & Deploy to Cloud Run
    needs: ci-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GCP Project ID variable
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "Error: Set GitHub Repository Variable GCP_PROJECT_ID first (see DEPLOYMENT.md)."
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}"
          docker build -t "${IMAGE_URI}:${{ github.sha }}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${{ github.sha }}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --timeout=300
          env_vars: |
            LLM_PROVIDER=auto
            GEMINI_MODEL=gemini-3.8-flash
            OPENAI_MODEL=gpt-4o-mini
            ANTHROPIC_MODEL=claude-3-5-sonnet-latest
            CHASEZERO_DB_PATH=/tmp/chasezero.db
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}

      - name: Show Live Cloud Run URL
        run: |
          echo "ChaseZero deployed at: ${{ steps.deploy.outputs.url }}"
